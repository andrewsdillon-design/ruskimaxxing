name: Build apps

# Every push to main tests on Windows, macOS and Linux, then builds the three
# desktop apps plus the Excel spreadsheet (download them from the run's
# "Artifacts" section).
# To publish a GitHub Release: Actions tab -> Build apps -> Run workflow, and
# enter a version (e.g. v2.0.0). Pushing a v* tag does the same.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, e.g. v2.0.0 (leave blank to just build)"
        required: false
        default: ""

permissions:
  contents: write

env:
  APP: RuskiMaxxing  # file-name prefix for the built apps and spreadsheet
  PYI_ASSETS: --add-data src/ruskimaxxing/assets:ruskimaxxing/assets
  ICON: src/ruskimaxxing/assets/icon.ico

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: Windows.exe
          - os: macos-latest
            suffix: macOS.zip
          - os: ubuntu-latest
            suffix: Linux.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Test
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a pytest -q; else pytest -q; fi

      - name: Build app (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "$APP" $PYI_ASSETS --icon "$ICON" packaging/launcher.py
          mv "dist/$APP.exe" "$APP-${{ matrix.suffix }}"
      - name: Build app (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name "$APP" $PYI_ASSETS --icon src/ruskimaxxing/assets/icon.icns --osx-bundle-identifier "io.github.$APP" packaging/launcher.py
          ditto -c -k --keepParent "dist/$APP.app" "$APP-${{ matrix.suffix }}"
      - name: Build app (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "$APP" $PYI_ASSETS --icon "$ICON" packaging/launcher.py
          tar -czf "$APP-${{ matrix.suffix }}" -C dist "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-${{ matrix.suffix }}
          path: ${{ env.APP }}-${{ matrix.suffix }}

  server:
    # Cloud backup server + end-to-end sync tests against a real PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm
          POSTGRES_DB: rmtest
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . -r server/requirements.txt
      - run: pytest -q server/tests tests/test_sync.py
      - name: Same sync tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://rm:rm@localhost:5432/rmtest
        run: pytest -q tests/test_sync.py

  spreadsheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: ruskimaxxing excel "$APP.xlsx"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}.xlsx
          path: ${{ env.APP }}.xlsx

  android:
    # Phone app: a debug-signed APK anyone can install ("install unknown apps").
    # Store (Play) builds need your own signing key - see README "Phone apps".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install briefcase==0.4.5
      - run: briefcase create android --no-input
      - run: briefcase build android --no-input
      - run: briefcase package android -p debug-apk --no-input
      - run: mv dist/*.apk "$APP-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-Android.apk
          path: ${{ env.APP }}-Android.apk

  ios:
    # Builds the iPhone app for the iOS Simulator (no Apple account needed) to prove it
    # compiles. Installing on a real iPhone needs an Apple Developer account for signing.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install briefcase==0.4.5
      - run: briefcase create iOS --no-input
      - run: briefcase build iOS --no-input
      - name: Zip simulator build
        run: |
          app=$(find build -name "*.app" -path "*iphonesimulator*" | head -1)
          echo "Built: $app"
          ditto -c -k --keepParent "$app" "$APP-iOS-Simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-iOS-Simulator.zip
          path: ${{ env.APP }}-iOS-Simulator.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [build, spreadsheet, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: rm -f assets/*iOS-Simulator*  # simulator builds don't install on real iPhones
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: assets/*
          generate_release_notes: true
