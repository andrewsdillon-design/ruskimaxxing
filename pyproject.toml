[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruskimaxxing"
version = "2.0.0"
description = "Free 1-year beginner strength, mass and power program with PR tracking: Excel spreadsheet plus Windows, macOS and Linux app."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[project.scripts]
ruskimaxxing = "ruskimaxxing.cli:main"

[project.gui-scripts]
ruskimaxxing-app = "ruskimaxxing.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
