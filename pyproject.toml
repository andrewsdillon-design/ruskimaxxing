[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruskimaxxing"
version = "0.1.0"
description = "Conjugate training combining undulating periodization with Verkhoshansky, Siff, and Prilepin."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ruskimaxxing = "ruskimaxxing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
