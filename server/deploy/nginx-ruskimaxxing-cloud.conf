# /etc/nginx/sites-available/ruskimaxxing-cloud
# Its own server block, chosen by server_name - your existing site is untouched.
# certbot --nginx adds the HTTPS (443) part to this file.

# at most 10 requests/second per IP to the API (burst 20); 5/minute for login-type calls
limit_req_zone $binary_remote_addr zone=rmx_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=rmx_auth:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name API_DOMAIN;

    client_max_body_size 5m;

    location ~ ^/(api/(login|register|password-reset)|account/(login|register|forgot|delete))$ {
        limit_req zone=rmx_auth burst=5 nodelay;
        include /etc/nginx/snippets/ruskimaxxing-proxy.conf;
    }

    location / {
        limit_req zone=rmx_api burst=20 nodelay;
        include /etc/nginx/snippets/ruskimaxxing-proxy.conf;
    }
}
